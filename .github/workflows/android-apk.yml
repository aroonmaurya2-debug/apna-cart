name: Build Apna Cart Android APK

on:
  push:
    branches:
      - android-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android wrapper for the live Apna Cart site
        run: |
          mkdir apna-cart-android
          cd apna-cart-android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.apnacart.app",
            "appName": "Apna Cart",
            "webDir": "www",
            "server": {
              "url": "https://apna-cart-frontend.onrender.com",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd apna-cart-android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apna-cart-debug-apk
          path: apna-cart-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
