name: Apply Home Filters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[home-filters-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend and backend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/AppFixed.tsx')
          s = app.read_text()

          s = s.replace(
              "type Product = { id: number; name: string; category: string; price: number; oldPrice: number; image: string; rating: number; reviews: number; discount: string; description: string }",
              "type Product = { id: number; name: string; category: string; gender?: string; price: number; oldPrice: number; image: string; rating: number; reviews: number; discount: string; description: string }"
          )
          s = s.replace(
              "  const [category, setCategory] = useState('All')\n  const [view,",
              "  const [category, setCategory] = useState('All')\n  const [gender, setGender] = useState('All')\n  const [sortBy, setSortBy] = useState('relevance')\n  const [view,"
          )
          old = "  const filtered = useMemo(() => products.filter(p => (category === 'All' || p.category === category) && p.name.toLowerCase().includes(queryText.toLowerCase())), [category, queryText])"
          new = """  const productGender = (p: Product) => p.gender || (p.category === 'Men' || /\\bmen'?s?\\b/i.test(p.name) ? 'Men' : p.category === 'Kids' || /\\bkids?\\b/i.test(p.name) ? 'Kids' : p.category === 'All Categories' && /smartphone|headphones/i.test(p.name) ? 'Unisex' : 'Women'))
  const filtered = useMemo(() => {
    const list = products.filter(p => (category === 'All' || p.category === category) && (gender === 'All' || productGender(p) === gender) && p.name.toLowerCase().includes(queryText.toLowerCase()))
    return [...list].sort((a, b) => sortBy === 'price-low' ? a.price - b.price : sortBy === 'price-high' ? b.price - a.price : sortBy === 'rating' ? b.rating - a.rating : sortBy === 'discount' ? ((b.oldPrice - b.price) / b.oldPrice) - ((a.oldPrice - a.price) / a.oldPrice) : 0)
  }, [category, gender, queryText, sortBy])"""
          if old in s:
              s = s.replace(old, new)
          old_row = '<section className="filter-row"><button>↕ Sort</button><button onClick={() => setCategory(\'All\')}>Category⌄</button><button onClick={() => setMessage(\'Gender filter coming soon.\')}>Gender⌄</button><button onClick={() => setMessage(\'More filters coming soon.\')}>≡ Filters</button></section>'
          new_row = '''<section className="filter-row">
          <select aria-label="Sort products" value={sortBy} onChange={e => setSortBy(e.target.value)}><option value="relevance">↕ Sort</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="rating">Top Rated</option><option value="discount">Best Discount</option></select>
          <select aria-label="Category" value={category === 'All' ? 'All' : category} onChange={e => setCategory(e.target.value)}><option value="All">Category</option>{categories.map(([label]) => label !== 'All Categories' && <option key={label} value={label}>{label}</option>)}</select>
          <select aria-label="Gender" value={gender} onChange={e => setGender(e.target.value)}><option value="All">Gender</option><option value="Women">Women</option><option value="Men">Men</option><option value="Kids">Kids</option><option value="Unisex">Unisex</option></select>
          <select aria-label="Filters" value="all" onChange={e => { if (e.target.value === 'reset') { setCategory('All'); setGender('All'); setSortBy('relevance'); setQueryText('') } }}><option value="all">≡ Filters</option><option value="reset">Reset All Filters</option></select>
        </section>'''
          if old_row in s:
              s = s.replace(old_row, new_row)
          app.write_text(s)

          server = Path('server/server.mjs')
          s = server.read_text()
          old = """app.get('/api/products', async (_request, response) => {
  if (!productsCollection) return response.json({ products: [] })
  try { const snapshot = await productsCollection.where('status', '==', 'active').get(); return response.json({ products: snapshot.docs.map((doc) => doc.data()) }) } catch (error) { console.error(error); return response.status(500).json({ message: 'Products could not be loaded.' }) }
})"""
          new = """const inferGender = (product) => product.gender || (product.category === 'Men' || /\\bmen'?s?\\b/i.test(product.name) ? 'Men' : product.category === 'Kids' || /\\bkids?\\b/i.test(product.name) ? 'Kids' : product.category === 'All Categories' && /smartphone|headphones/i.test(product.name) ? 'Unisex' : 'Women')

app.get('/api/products', async (request, response) => {
  if (!productsCollection) return response.json({ products: [] })
  try {
    const snapshot = await productsCollection.where('status', '==', 'active').get()
    const category = clean(request.query.category)
    const gender = clean(request.query.gender)
    const sort = clean(request.query.sort)
    let products = snapshot.docs.map((doc) => ({ ...doc.data(), gender: inferGender(doc.data()) }))
    if (category && category !== 'All') products = products.filter((product) => product.category === category)
    if (gender && gender !== 'All') products = products.filter((product) => inferGender(product) === gender)
    if (sort === 'price-low') products.sort((a, b) => Number(a.price) - Number(b.price))
    else if (sort === 'price-high') products.sort((a, b) => Number(b.price) - Number(a.price))
    else if (sort === 'rating') products.sort((a, b) => Number(b.rating || 0) - Number(a.rating || 0))
    else if (sort === 'discount') products.sort((a, b) => ((Number(b.oldPrice) - Number(b.price)) / Math.max(Number(b.oldPrice), 1)) - ((Number(a.oldPrice) - Number(a.price)) / Math.max(Number(a.oldPrice), 1)))
    return response.json({ products })
  } catch (error) { console.error(error); return response.status(500).json({ message: 'Products could not be loaded.' }) }
})"""
          if old in s:
              s = s.replace(old, new)
          old_post = "const { name, category, price, oldPrice, image, sizes, colors, description } = request.body || {}"
          new_post = "const { name, category, gender, price, oldPrice, image, sizes, colors, description } = request.body || {}"
          s = s.replace(old_post, new_post)
          s = s.replace("name: name.trim(), category: category.trim(), price: numericPrice,", "name: name.trim(), category: category.trim(), gender: ['Women', 'Men', 'Kids', 'Unisex'].includes(gender) ? gender : 'Women', price: numericPrice,")
          server.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppFixed.tsx server/server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add category and gender dropdown filters [home-filters-applied]"
          git push
