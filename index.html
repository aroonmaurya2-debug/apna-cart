<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Apna Cart - fashion, home, beauty, electronics aur grocery ek hi cart mein." />
    <meta name="theme-color" content="#183d30" />
    <style>
      #apna-welcome{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 15% 10%,#ccefe0 0%,transparent 42%),radial-gradient(ellipse at 90% 90%,#d8e8ff 0%,transparent 38%),linear-gradient(135deg,#f5faf7 0%,#e4f5ed 48%,#edf4ff 100%);color:#183d30;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s ease}
      #apna-welcome:before,#apna-welcome:after{content:"";position:absolute;border:1px solid #176b5018;border-radius:50%;width:75vw;height:75vw;max-width:620px;max-height:620px;min-width:280px;min-height:280px}
      #apna-welcome:after{width:100vw;height:100vw;max-width:820px;max-height:820px;min-width:360px;min-height:360px;border-color:#247cba18}
      #apna-welcome .welcome-card{position:relative;z-index:1;width:min(88vw,440px);box-sizing:border-box;padding:34px 20px 30px;text-align:center;border:1px solid #cfe4d9;border-radius:30px;background:linear-gradient(145deg,#ffffffef,#f7fcf9e8);box-shadow:0 24px 70px #174c3620;backdrop-filter:blur(10px);animation:apnaRise .7s ease both}
      #apna-welcome .welcome-bag{display:grid;place-items:center;width:92px;height:92px;margin:0 auto 20px;border-radius:28px;background:linear-gradient(145deg,#247cba,#187653);box-shadow:0 12px 30px #18765338;font-size:48px;animation:apnaFloat 2s ease-in-out infinite}
      #apna-welcome .welcome-kicker{margin:0 0 7px;font-size:12px;font-weight:800;letter-spacing:4px;color:#247cba}
      #apna-welcome h1{margin:0;font-size:clamp(32px,9vw,46px);line-height:1.05;font-weight:900;letter-spacing:-1.5px;color:#176b50;text-shadow:0 4px 22px #176b5010}
      #apna-welcome .welcome-tagline{margin:15px 0 24px;font-size:14px;color:#527365;letter-spacing:.3px}
      #apna-welcome .welcome-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid #cfe4d9;border-radius:999px;background:#e6f5ee;font-size:12px;font-weight:700;color:#176b50}
      #apna-welcome .welcome-dot{width:7px;height:7px;border-radius:50%;background:#8df0b3;box-shadow:0 0 12px #8df0b3}
      #apna-welcome.apna-hidden{opacity:0;visibility:hidden;pointer-events:none}
      @keyframes apnaRise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes apnaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @media(prefers-reduced-motion:reduce){#apna-welcome *,#apna-welcome{animation:none!important;transition:none!important}}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apna Cart</title>
    <script>
      try {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
        if ('caches' in window) caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="apna-welcome" role="status" aria-label="Welcome to Apna Cart"><div class="welcome-card"><div class="welcome-bag" aria-hidden="true">🛍️</div><p class="welcome-kicker">WELCOME TO</p><h1>APNA CART</h1><p class="welcome-tagline">Har Shopping, Aasaan Shopping</p><div class="welcome-pill"><span class="welcome-dot"></span> Your happy shopping place</div></div></div>
    <script>
      (function(){var splash=document.getElementById("apna-welcome");if(!splash)return;var hide=function(){splash.classList.add("apna-hidden");window.setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash)},500)};window.setTimeout(hide,1900);window.addEventListener("load",function(){window.setTimeout(hide,900)},{once:true});})();
    </script>
    <div id="root"><main style="min-height:100vh;display:grid;place-items:center;font-family:system-ui"><div style="text-align:center"><h2>Apna Cart</h2><p>App load ho raha hai…</p></div></main></div>

    <script src="/account-page-enhance.js" defer></script>
    <script src="/seller-product-manager.js" defer></script>
    <script src="/seller-order-manager.js" defer></script>
    <script src="/seller-earnings-manager.js" defer></script>
    <script src="/profile-header.js" defer></script>
    <script src="/profile-photo.js" defer></script>
    <script src="/referral-page-fix.js?v=2" defer></script>
    <script src="/wishlist.js" defer></script>
    <script src="/header-actions.js" defer></script>
    <script src="/premium-header-icons.js" defer></script>
    <script src="/premium-search-icons.js" defer></script>
    <script src="/filter-row-position.js" defer></script>
    <script src="/product-detail-enhance.js" defer></script>
    <script src="/buy-now-checkout-fix.js" defer></script>
    <script src="/cart-checkout-enhance.js" defer></script>
    <script src="/order-details.js" defer></script>
    <script src="/hide-product-cart-buttons.js" defer></script>
    <script src="/bottom-nav-update.js" defer></script>
    <link rel="stylesheet" href="/bottom-nav-size-fix.css" />
  </body>
</html>
