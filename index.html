<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Apna Cart - fashion, home, beauty, electronics aur grocery ek hi cart mein." />
    <meta name="theme-color" content="#183d30" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apna Cart</title>
    <script>
      try {
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
        if ('caches' in window) caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
      } catch (_) {}
      window.addEventListener('error', (e) => { window.__apnaCartStartupError = String(e.error?.stack || e.message || 'Startup error'); });
      window.addEventListener('unhandledrejection', (e) => { window.__apnaCartStartupError = String(e.reason?.stack || e.reason || 'Startup error'); });
      window.setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.querySelector('p')?.textContent?.includes('App load ho raha hai')) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui"><div style="max-width:620px"><h2>Apna Cart start nahi ho paaya</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere">' + String(window.__apnaCartStartupError || 'React startup failed').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre><button onclick="location.reload()">Reload App</button></div></main>';
        }
      }, 8000);
    </script>
  </head>
  <body>
    <div id="root"><main style="min-height:100vh;display:grid;place-items:center;font-family:system-ui"><div style="text-align:center"><h2>Apna Cart</h2><p>App load ho raha hai…</p></div></main></div>
    <script type="module" src="/src/entry.tsx"></script>
    <script src="/api-fix.js"></script>
    <script src="/camera-fix.js"></script>
    <script src="/catalog-sync.js"></script>
    <script src="/recently-viewed.js"></script>
    <script src="/checkout-address.js"></script>
    <script src="/order-tracking.js"></script>
    <script src="/inventory.js"></script>
    <script src="/notifications.js"></script>
    <script src="/profile-photo.js"></script>
    <script src="/login-access.js"></script>
    <script src="/account-page.js"></script>
    <script src="/firebase-auth.js"></script>
  </body>
</html>
